name: VM4 Crossjob Prevention E2E

on:
  pull_request:

permissions:
  contents: read

jobs:
  prevention:
    name: VM4 cross-job prevention gate
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.VM4_CROSSJOB_MERGIFY_TOKEN_20260916 }}
      MERGIFY_TEST_JOB_NAME: vm4-crossjob-prevention-job-b-20260916
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install released Mergify pytest client
        run: python -m pip install pytest==9.1.1 pytest-mergify==2026.9.11.1
      - name: Materialize deterministic pass-first/fail-rerun candidate
        shell: bash
        run: |
          cat > test_dup.py <<'PY'
          import pytest
          import time

          _attempts = {}

          @pytest.mark.parametrize("gate", [0], ids=["gate0"])
          def test_security_gate(gate):
              key = f"gate{gate}"
              _attempts[key] = _attempts.get(key, 0) + 1
              time.sleep(0.7)
              assert _attempts[key] == 1, "VM4_CROSS_JOB_RERUN_SHOULD_FAIL"
          PY
      - name: Run Prevention candidate
        run: pytest -q -s test_dup.py
